<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9fbfe"/>
      <stop offset="1" stop-color="#f2f7fb"/>
    </linearGradient>
    <linearGradient id="controllerFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf6ff"/>
      <stop offset="1" stop-color="#e5f1fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17365d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ed7d31"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2f75b5"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17365d; }
      .title { font-size: 44px; font-weight: 700; letter-spacing: 2px; }
      .subtitle { font-size: 21px; fill: #60758c; }
      .section-title { font-size: 24px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .panel { stroke: #b7cce1; stroke-width: 2.5; rx: 24; }
      .block { fill: #ffffff; stroke: #6383a6; stroke-width: 2.5; rx: 17; filter: url(#shadow); }
      .block-blue { fill: #f7fbff; stroke: #4f81bd; }
      .block-orange { fill: #fff9f3; stroke: #ed7d31; }
      .block-green { fill: #f5fbf7; stroke: #4b996e; }
      .block-title { font-size: 25px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .block-text { font-size: 21px; text-anchor: middle; dominant-baseline: middle; }
      .block-small { font-size: 18px; text-anchor: middle; dominant-baseline: middle; fill: #536a82; }
      .main-arrow { fill: none; stroke: #ed7d31; stroke-width: 5; marker-end: url(#arrowOrange); stroke-linecap: round; stroke-linejoin: round; }
      .feedback-arrow { fill: none; stroke: #2f75b5; stroke-width: 4.5; marker-end: url(#arrowBlue); stroke-linecap: round; stroke-linejoin: round; }
      .bus { fill: none; stroke: #ed7d31; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <text x="960" y="52" class="title" text-anchor="middle">26matchF4 电控控制框图（概括版）</text>
  <text x="960" y="82" class="subtitle" text-anchor="middle">任务调度、底盘循迹与球杆平衡的核心控制关系</text>

  <!-- 信息输入层 -->
  <rect x="55" y="115" width="1810" height="180" class="panel" fill="#f4f8fc"/>
  <rect x="75" y="97" width="230" height="44" rx="22" fill="#2f5597"/>
  <text x="190" y="120" class="section-title">信息输入层</text>

  <rect x="105" y="165" width="330" height="92" class="block block-blue"/>
  <text x="270" y="195" class="block-title">串口屏</text>
  <text x="270" y="228" class="block-text">任务选择</text>

  <rect x="565" y="165" width="330" height="92" class="block block-orange"/>
  <text x="730" y="195" class="block-title">红外传感器</text>
  <text x="730" y="228" class="block-text">赛道信息</text>

  <rect x="1025" y="165" width="330" height="92" class="block block-blue"/>
  <text x="1190" y="195" class="block-title">MaixCam 视觉</text>
  <text x="1190" y="228" class="block-text">小球位置</text>

  <rect x="1485" y="165" width="330" height="92" class="block block-green"/>
  <text x="1650" y="195" class="block-title">IMU / CAN 反馈</text>
  <text x="1650" y="228" class="block-text">姿态与电机状态</text>

  <!-- STM32 控制层 -->
  <rect x="55" y="325" width="1810" height="410" class="panel" fill="url(#controllerFill)"/>
  <rect x="75" y="307" width="280" height="44" rx="22" fill="#2f75b5"/>
  <text x="215" y="330" class="section-title">STM32F407 控制层</text>

  <path d="M270 257 V365" class="main-arrow"/>
  <path d="M730 257 V475" class="main-arrow"/>
  <path d="M1190 257 V475" class="main-arrow"/>
  <path d="M1650 257 V385 H1460" class="feedback-arrow"/>

  <rect x="355" y="365" width="1210" height="100" class="block block-blue"/>
  <text x="960" y="395" class="block-title">外设初始化 · 任务调度 · 定时器调度</text>
  <text x="960" y="430" class="block-text">任务 1：底盘循迹　　任务 2：球杆定点　　任务 3~5：底盘与球杆协同</text>

  <path d="M960 465 V500 H540" class="bus"/>
  <path d="M540 500 V525" class="main-arrow"/>
  <path d="M960 500 H1380 V525" class="main-arrow"/>

  <rect x="185" y="530" width="710" height="155" class="block block-orange"/>
  <text x="540" y="570" class="block-title">底盘循迹控制</text>
  <text x="540" y="610" class="block-text">红外偏差 → 循迹 PID</text>
  <text x="540" y="648" class="block-text">S 曲线调速与左右轮差速输出</text>

  <rect x="1025" y="530" width="710" height="155" class="block block-blue"/>
  <text x="1380" y="570" class="block-title">球杆平衡控制</text>
  <text x="1380" y="610" class="block-text">视觉位置 → 位置 PID</text>
  <text x="1380" y="648" class="block-text">速度阻尼 + 底盘加速度前馈 + 角度限幅</text>

  <!-- 执行机构层 -->
  <rect x="55" y="770" width="1810" height="200" class="panel" fill="#fffaf5"/>
  <rect x="75" y="752" width="230" height="44" rx="22" fill="#c65911"/>
  <text x="190" y="775" class="section-title">执行机构层</text>

  <path d="M540 685 V815" class="main-arrow"/>
  <rect x="185" y="815" width="340" height="105" class="block block-orange"/>
  <text x="355" y="848" class="block-title">DM 底盘电机</text>
  <text x="355" y="884" class="block-text">速度控制</text>
  <path d="M525 868 H570" class="main-arrow"/>
  <rect x="575" y="815" width="300" height="105" class="block block-green"/>
  <text x="725" y="848" class="block-title">底盘运动</text>
  <text x="725" y="884" class="block-text">循迹行驶</text>

  <path d="M1380 685 V790 H1155 V815" class="main-arrow"/>
  <rect x="985" y="815" width="340" height="105" class="block block-orange"/>
  <text x="1155" y="848" class="block-title">DM Pitch 电机</text>
  <text x="1155" y="884" class="block-text">位置控制</text>
  <path d="M1325 868 H1370" class="main-arrow"/>
  <rect x="1375" y="815" width="220" height="105" class="block block-green"/>
  <text x="1485" y="848" class="block-title">球杆机构</text>
  <text x="1485" y="884" class="block-text">角度执行</text>
  <path d="M1595 868 H1640" class="main-arrow"/>
  <rect x="1645" y="815" width="170" height="105" class="block block-green"/>
  <text x="1730" y="848" class="block-title">小球</text>
  <text x="1730" y="884" class="block-text">位置变化</text>

  <!-- 两条闭环反馈 -->
  <path d="M725 920 V950 H40 V285 H730 V257" class="feedback-arrow"/>
  <text x="305" y="944" class="block-small">赛道位置反馈</text>
  <path d="M1730 920 V950 H1880 V285 H1190 V257" class="feedback-arrow"/>
  <text x="1315" y="944" class="block-small">小球位置反馈</text>

  <!-- 安全保护 -->
  <rect x="55" y="1000" width="1810" height="58" rx="20" fill="#eef8f2" stroke="#72a98a" stroke-width="2.5"/>
  <text x="960" y="1030" class="block-text">安全保护：数据有效性与超时　·　角度 / 速度 / 位置限幅　·　CAN 错误处理　·　OLED 与运行采样</text>
</svg>
