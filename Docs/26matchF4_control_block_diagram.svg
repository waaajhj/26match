<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f3f7fb"/>
    </linearGradient>
    <linearGradient id="panelBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f8ff"/>
      <stop offset="1" stop-color="#eaf4ff"/>
    </linearGradient>
    <linearGradient id="panelOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf4"/>
      <stop offset="1" stop-color="#fff3e5"/>
    </linearGradient>
    <linearGradient id="panelGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5fbf8"/>
      <stop offset="1" stop-color="#ecf8f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17365d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#f07f2f"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2f75b5"/>
    </marker>
    <marker id="arrowGray" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#7d8da1"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17365d; }
      .title { font-size: 46px; font-weight: 700; letter-spacing: 2px; }
      .subtitle { font-size: 22px; fill: #5f7187; }
      .panel { stroke: #b8cbe0; stroke-width: 2.5; rx: 24; }
      .panel-title { font-size: 27px; font-weight: 700; fill: #ffffff; }
      .block { fill: #ffffff; stroke: #6f89a8; stroke-width: 2.5; rx: 15; filter: url(#shadow); }
      .block-blue { fill: #f7fbff; stroke: #4f81bd; }
      .block-orange { fill: #fffaf5; stroke: #ed7d31; }
      .block-green { fill: #f6fcf8; stroke: #4f9d73; }
      .block-gray { fill: #f6f8fa; stroke: #98a6b6; }
      .block-title { font-size: 24px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .block-text { font-size: 22px; text-anchor: middle; dominant-baseline: middle; }
      .block-small { font-size: 19px; text-anchor: middle; dominant-baseline: middle; }
      .note { font-size: 18px; fill: #5f7187; }
      .small-label { font-size: 18px; fill: #51677f; font-weight: 600; }
      .main-arrow { fill: none; stroke: #f07f2f; stroke-width: 5; marker-end: url(#arrowOrange); stroke-linecap: round; stroke-linejoin: round; }
      .feedback-arrow { fill: none; stroke: #2f75b5; stroke-width: 4.5; marker-end: url(#arrowBlue); stroke-linecap: round; stroke-linejoin: round; }
      .feedforward-arrow { fill: none; stroke: #f07f2f; stroke-width: 4; stroke-dasharray: 12 9; marker-end: url(#arrowOrange); stroke-linecap: round; stroke-linejoin: round; }
      .optional-arrow { fill: none; stroke: #7d8da1; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrowGray); }
      .bus { fill: none; stroke: #f07f2f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .divider { stroke: #c6d4e3; stroke-width: 2; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="2560" height="1440" fill="url(#bg)"/>
  <text x="1280" y="54" class="title" text-anchor="middle">26matchF4 电控控制框图</text>
  <text x="1280" y="84" class="subtitle" text-anchor="middle">基于当前 STM32F407 工程的软件调度、通信接口与执行机构</text>

  <!-- 系统初始化与任务调度 -->
  <rect x="50" y="105" width="2460" height="280" class="panel" fill="url(#panelBlue)"/>
  <rect x="70" y="87" width="330" height="46" rx="23" fill="#2f5597"/>
  <text x="235" y="111" class="panel-title" text-anchor="middle" dominant-baseline="middle">系统初始化与任务调度</text>

  <rect x="90" y="142" width="180" height="66" class="block block-blue"/>
  <text x="180" y="175" class="block-title">上电初始化</text>
  <path d="M270 175 H315" class="main-arrow"/>

  <rect x="320" y="132" width="580" height="86" class="block block-blue"/>
  <text x="610" y="161" class="block-text">GPIO / DMA / CAN1 / CAN2</text>
  <text x="610" y="190" class="block-text">UART / TIM / OLED / PID / DWT</text>
  <path d="M900 175 H945" class="main-arrow"/>

  <rect x="950" y="137" width="280" height="76" class="block block-blue"/>
  <text x="1090" y="160" class="block-text">电机使能</text>
  <text x="1090" y="190" class="block-text">Pitch 回零</text>

  <rect x="1335" y="142" width="230" height="66" class="block block-orange"/>
  <text x="1450" y="175" class="block-title">串口屏 USART2</text>
  <path d="M1565 175 H1605" class="main-arrow"/>
  <rect x="1610" y="132" width="390" height="86" class="block block-orange"/>
  <text x="1805" y="160" class="block-text">任务帧</text>
  <text x="1805" y="190" class="block-small">0xAA + 任务号 1~5 + 0x55</text>
  <path d="M2000 175 H2045" class="main-arrow"/>
  <rect x="2050" y="137" width="360" height="76" class="block block-orange"/>
  <text x="2230" y="160" class="block-text">task_switch</text>
  <text x="2230" y="190" class="block-text">任务调度</text>

  <path d="M2230 213 V232 H250" class="bus"/>
  <path d="M250 232 V252" class="main-arrow"/>
  <path d="M735 232 V252" class="main-arrow"/>
  <path d="M1220 232 V252" class="main-arrow"/>
  <path d="M1705 232 V252" class="main-arrow"/>
  <path d="M2190 232 V252" class="main-arrow"/>

  <rect x="80" y="255" width="340" height="82" class="block block-orange"/>
  <text x="250" y="282" class="block-title">任务 1</text>
  <text x="250" y="312" class="block-text">仅底盘循迹</text>

  <rect x="565" y="255" width="340" height="82" class="block block-orange"/>
  <text x="735" y="282" class="block-title">任务 2</text>
  <text x="735" y="312" class="block-small">底盘静止；球 +5 cm → -5 cm</text>

  <rect x="1050" y="255" width="340" height="82" class="block block-orange"/>
  <text x="1220" y="282" class="block-title">任务 3</text>
  <text x="1220" y="312" class="block-small">定时循迹 + 球杆闭环</text>

  <rect x="1535" y="255" width="340" height="82" class="block block-orange"/>
  <text x="1705" y="282" class="block-title">任务 4</text>
  <text x="1705" y="312" class="block-small">循迹至路口 + 球杆闭环</text>

  <rect x="2020" y="255" width="340" height="82" class="block block-orange"/>
  <text x="2190" y="282" class="block-title">任务 5</text>
  <text x="2190" y="312" class="block-small">首帧视觉定点 + 循迹</text>

  <!-- 红外循迹闭环 -->
  <rect x="50" y="415" width="2460" height="345" class="panel" fill="url(#panelOrange)"/>
  <rect x="70" y="397" width="390" height="46" rx="23" fill="#c65911"/>
  <text x="265" y="421" class="panel-title" text-anchor="middle" dominant-baseline="middle">A. 红外循迹与底盘速度闭环</text>
  <rect x="2050" y="400" width="395" height="36" rx="18" fill="#fff4e8" stroke="#ed7d31" stroke-width="2"/>
  <text x="2248" y="419" class="small-label" text-anchor="middle" dominant-baseline="middle">任务 1 / 3 / 4 / 5 使能</text>

  <rect x="85" y="500" width="190" height="74" class="block block-orange"/>
  <text x="180" y="523" class="block-text">TIM3</text>
  <text x="180" y="552" class="block-small">100 Hz 查询</text>
  <path d="M275 537 H315" class="main-arrow"/>

  <rect x="320" y="490" width="300" height="94" class="block block-orange"/>
  <text x="470" y="521" class="block-text">12 路红外循迹传感器</text>
  <text x="470" y="555" class="block-small">USART6 · 10 ms 查询周期</text>
  <path d="M620 537 H660" class="main-arrow"/>

  <rect x="665" y="490" width="285" height="94" class="block block-orange"/>
  <text x="807" y="521" class="block-text">D1~D12 线状态</text>
  <text x="807" y="555" class="block-small">脱线 / 路口检测</text>
  <path d="M950 537 H990" class="main-arrow"/>

  <rect x="995" y="490" width="270" height="94" class="block block-orange"/>
  <text x="1130" y="521" class="block-text">偏差计算</text>
  <text x="1130" y="555" class="block-small">bais_judgment</text>
  <path d="M1265 537 H1305" class="main-arrow"/>

  <rect x="1310" y="490" width="190" height="94" class="block block-orange"/>
  <text x="1405" y="521" class="block-text">循迹 PID</text>
  <text x="1405" y="555" class="block-small">横向偏差反馈</text>
  <path d="M1500 537 H1540" class="main-arrow"/>

  <rect x="1545" y="490" width="260" height="94" class="block block-orange"/>
  <text x="1675" y="521" class="block-text">左右轮差速解算</text>
  <text x="1675" y="555" class="block-small">目标速度 ± 转向量</text>
  <path d="M1805 537 H1845" class="main-arrow"/>

  <rect x="1850" y="480" width="320" height="114" class="block block-orange"/>
  <text x="2010" y="510" class="block-text">DM 左 / 右底盘电机</text>
  <text x="2010" y="543" class="block-small">CAN1 · 速度模式</text>
  <text x="2010" y="570" class="block-small">电机状态与速度反馈</text>
  <path d="M2170 537 H2210" class="main-arrow"/>

  <rect x="2215" y="490" width="230" height="94" class="block block-green"/>
  <text x="2330" y="521" class="block-title">底盘运动</text>
  <text x="2330" y="555" class="block-small">赛道环境</text>

  <rect x="1040" y="625" width="330" height="68" class="block block-blue"/>
  <text x="1205" y="647" class="block-text">S 曲线加减速</text>
  <text x="1205" y="674" class="block-small">3~5 ms 指令更新周期</text>
  <path d="M1370 659 H1510 V575 H1545" class="main-arrow"/>

  <rect x="1480" y="625" width="260" height="68" class="block block-blue"/>
  <text x="1610" y="647" class="block-text">JY61P IMU</text>
  <text x="1610" y="674" class="block-small">USART3 · 姿态角</text>
  <path d="M1740 659 H1780" class="main-arrow"/>
  <rect x="1785" y="625" width="250" height="68" class="block block-blue"/>
  <text x="1910" y="647" class="block-text">航向 PID</text>
  <text x="1910" y="674" class="block-small">转向辅助路径</text>
  <path d="M1785 659 H1760 V584 H1675" class="main-arrow"/>

  <rect x="2050" y="625" width="375" height="68" class="block block-gray"/>
  <text x="2238" y="647" class="block-small">保留兼容路径：CAN2</text>
  <text x="2238" y="674" class="block-small">M2006 四电机速度 PID</text>
  <path d="M1805 570 H1825 V710 H2238 V693" class="optional-arrow"/>

  <path d="M2330 584 V727 H470 V584" class="feedback-arrow"/>
  <text x="1340" y="748" class="small-label" text-anchor="middle">赛道相对位置反馈</text>

  <!-- 视觉球杆闭环 -->
  <rect x="50" y="790" width="2460" height="450" class="panel" fill="url(#panelBlue)"/>
  <rect x="70" y="772" width="360" height="46" rx="23" fill="#2f75b5"/>
  <text x="250" y="796" class="panel-title" text-anchor="middle" dominant-baseline="middle">B. 视觉球杆位置闭环</text>
  <rect x="2050" y="775" width="395" height="36" rx="18" fill="#eef6ff" stroke="#4f81bd" stroke-width="2"/>
  <text x="2248" y="794" class="small-label" text-anchor="middle" dominant-baseline="middle">任务 2 / 3 / 4 / 5 使能</text>

  <rect x="720" y="812" width="650" height="58" class="block block-blue"/>
  <text x="1045" y="841" class="block-small">TIM4 · 50 Hz 调度：新帧更新位置 / 速度，每周期刷新加速度前馈</text>
  <path d="M1045 870 V894" class="feedback-arrow"/>

  <rect x="80" y="920" width="240" height="86" class="block block-blue"/>
  <text x="200" y="947" class="block-title">MaixCam 视觉</text>
  <text x="200" y="978" class="block-small">UART4</text>
  <path d="M320 963 H355" class="main-arrow"/>

  <rect x="360" y="920" width="240" height="86" class="block block-blue"/>
  <text x="480" y="947" class="block-text">视觉帧解包</text>
  <text x="480" y="978" class="block-small">AA + X 坐标 + 55</text>
  <path d="M600 963 H635" class="main-arrow"/>

  <rect x="640" y="920" width="220" height="86" class="block block-blue"/>
  <text x="750" y="947" class="block-text">小球位置 x</text>
  <text x="750" y="978" class="block-small">单位：pixel</text>
  <path d="M860 963 H895" class="main-arrow"/>

  <rect x="900" y="910" width="275" height="106" class="block block-blue"/>
  <text x="1037" y="940" class="block-text">目标位置</text>
  <text x="1037" y="970" class="block-small">任务 2：分段控制</text>
  <text x="1037" y="995" class="block-small">任务 3~5：五段参数选择</text>
  <path d="M1175 963 H1210" class="main-arrow"/>

  <rect x="1215" y="920" width="190" height="86" class="block block-blue"/>
  <text x="1310" y="947" class="block-title">位置 PID</text>
  <text x="1310" y="978" class="block-small">位置环输出</text>
  <path d="M1405 963 H1610" class="main-arrow"/>

  <circle cx="1650" cy="963" r="38" fill="#ffffff" stroke="#ed7d31" stroke-width="3" filter="url(#shadow)"/>
  <text x="1650" y="965" class="block-title">Σ</text>
  <path d="M1688 963 H1725" class="main-arrow"/>

  <rect x="1730" y="920" width="220" height="86" class="block block-orange"/>
  <text x="1840" y="947" class="block-text">球杆角限幅</text>
  <text x="1840" y="978" class="block-title">±12°</text>
  <path d="M1950 963 H1985" class="main-arrow"/>

  <rect x="1990" y="920" width="210" height="86" class="block block-orange"/>
  <text x="2095" y="947" class="block-text">四连杆逆解</text>
  <text x="2095" y="978" class="block-small">球杆角 → 电机角</text>
  <path d="M2200 963 H2235" class="main-arrow"/>

  <rect x="2240" y="910" width="230" height="106" class="block block-orange"/>
  <text x="2355" y="940" class="block-text">电机位置限幅</text>
  <text x="2355" y="972" class="block-small">-1.1 ~ 0.65 rad</text>
  <text x="2355" y="997" class="block-small">DM_pos_limit</text>

  <path d="M750 1006 V1055 H900" class="feedback-arrow"/>
  <rect x="900" y="1030" width="310" height="78" class="block block-blue"/>
  <text x="1055" y="1053" class="block-text">视觉速度估计 + 低通滤波</text>
  <text x="1055" y="1083" class="block-small">帧间差分 · 超时复位</text>
  <path d="M1210 1069 H1250" class="feedback-arrow"/>
  <rect x="1255" y="1030" width="250" height="78" class="block block-blue"/>
  <text x="1380" y="1053" class="block-text">速度阻尼反馈</text>
  <text x="1380" y="1083" class="block-small">-Kv · velocity</text>
  <path d="M1505 1069 H1590 V1000 H1622" class="feedback-arrow"/>

  <rect x="1000" y="1135" width="270" height="66" class="block block-orange"/>
  <text x="1135" y="1157" class="block-text">底盘加速度前馈</text>
  <text x="1135" y="1183" class="block-small">来自 S 曲线指令</text>
  <path d="M1135 1135 V1116 H1590 V985 H1615" class="feedforward-arrow"/>

  <rect x="1320" y="1135" width="260" height="66" class="block block-orange"/>
  <text x="1450" y="1157" class="block-text">高像素侧软制动</text>
  <text x="1450" y="1183" class="block-small">启动 / 目标渐入保护</text>
  <path d="M750 1006 V1126 H1450 V1135" class="feedback-arrow"/>
  <path d="M1580 1168 H1600 V990 H1618" class="main-arrow"/>

  <path d="M2355 1016 V1060" class="main-arrow"/>
  <rect x="2205" y="1065" width="300" height="90" class="block block-orange"/>
  <text x="2355" y="1092" class="block-text">DM Pitch 电机</text>
  <text x="2355" y="1125" class="block-small">CAN1 · MIT 位置模式</text>
  <path d="M2205 1110 H2165" class="main-arrow"/>
  <rect x="1935" y="1065" width="225" height="90" class="block block-green"/>
  <text x="2047" y="1092" class="block-title">球杆机构</text>
  <text x="2047" y="1125" class="block-small">四连杆执行</text>
  <path d="M1935 1110 H1895" class="main-arrow"/>
  <rect x="1665" y="1065" width="225" height="90" class="block block-green"/>
  <text x="1777" y="1092" class="block-title">小球运动</text>
  <text x="1777" y="1125" class="block-small">被控对象</text>

  <path d="M1777 1155 V1215 H200 V1006" class="feedback-arrow"/>
  <text x="780" y="1231" class="small-label" text-anchor="middle">视觉位置反馈</text>

  <!-- 安全与调试 -->
  <rect x="50" y="1270" width="2460" height="130" class="panel" fill="url(#panelGreen)"/>
  <rect x="70" y="1252" width="270" height="43" rx="21" fill="#3b7d5b"/>
  <text x="205" y="1274" class="panel-title" text-anchor="middle" dominant-baseline="middle">安全保护与调试</text>

  <rect x="75" y="1310" width="360" height="66" class="block block-green"/>
  <text x="255" y="1333" class="block-small">视觉有效范围 12~457 pixel</text>
  <text x="255" y="1358" class="block-small">仅完整 AA…55 新帧参与控制</text>

  <rect x="455" y="1310" width="340" height="66" class="block block-green"/>
  <text x="625" y="1333" class="block-small">任务 5 首帧等待超时 1000 ms</text>
  <text x="625" y="1358" class="block-small">未捕获有效目标则不启动</text>

  <rect x="815" y="1310" width="330" height="66" class="block block-green"/>
  <text x="980" y="1333" class="block-small">速度限幅 ±30 rad/s</text>
  <text x="980" y="1358" class="block-small">非法 NaN 输入 → 0</text>

  <rect x="1165" y="1310" width="360" height="66" class="block block-green"/>
  <text x="1345" y="1333" class="block-small">CAN 电机状态反馈</text>
  <text x="1345" y="1358" class="block-small">清错 / 重使能 / 发送错误计数</text>

  <rect x="1545" y="1310" width="360" height="66" class="block block-green"/>
  <text x="1725" y="1333" class="block-small">任务 2~5 RAM 调试采样</text>
  <text x="1725" y="1358" class="block-small">视觉 / PID / 电机 / 前馈</text>

  <rect x="1925" y="1310" width="270" height="66" class="block block-green"/>
  <text x="2060" y="1333" class="block-small">OLED 运行时间显示</text>
  <text x="2060" y="1358" class="block-small">100 ms 刷新</text>

  <rect x="2215" y="1310" width="270" height="66" class="block block-gray"/>
  <path d="M2240 1330 H2280" class="main-arrow"/>
  <text x="2360" y="1332" class="block-small">主控制流</text>
  <path d="M2240 1357 H2280" class="feedback-arrow"/>
  <text x="2360" y="1359" class="block-small">反馈路径</text>
</svg>
